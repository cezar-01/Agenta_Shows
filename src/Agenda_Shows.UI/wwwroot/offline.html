<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0B3C3F" />
    <title>Reconectando · UMURA</title>
    <!-- Página offline do service worker (molde do MyPods): 100% autossuficiente — sem app.css, sem fonte — porque é
         exibida justamente quando a rede falhou. O texto padrão é verdadeiro nas DUAS causas (aparelho sem rede ou
         servidor fora); quem especializa é o /js/offline.js, que também fica tentando e recarrega sozinho. As cores são
         as da UMURA escritas à mão de propósito: aqui não há folha de estilo para ler os tokens. -->
    <style>
        :root { color-scheme: light dark; }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            background: #EDECE7;
            color: #282828;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        .card {
            display: flex;
            align-items: flex-start;
            gap: 0.75rem;
            width: 100%;
            max-width: 26rem;
            padding: 1rem 1.15rem;
            background: #F7F6F2;
            border: 1px solid #CFCDC3;
            border-radius: 14px;
        }
        .dot { flex: none; width: 10px; height: 10px; margin-top: 0.35rem; border-radius: 50%; background: #FF5A3C; animation: pulse 1.4s ease-in-out infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.25; } }
        @media (prefers-reduced-motion: reduce) { .dot { animation: none; } }
        h1 { font-size: 1rem; font-weight: 700; margin: 0 0 0.2rem; color: #0B3C3F; }
        p { margin: 0; font-size: 0.9rem; line-height: 1.45; color: #3D3D3A; }
        .acao { display: inline-block; margin-top: 0.6rem; font-size: 0.9rem; font-weight: 600; color: #0B3C3F; }
        @media (prefers-color-scheme: dark) {
            body { background: #0B3C3F; color: #EDECE7; }
            .card { background: #0F474A; border-color: #23686B; }
            h1, .acao { color: #EDECE7; }
            p { color: #D6D5CF; }
        }
    </style>
</head>
<body>
    <div class="card" role="status" aria-live="polite">
        <span class="dot" aria-hidden="true"></span>
        <span>
            <h1 id="um-off-t">Não foi possível carregar a UMURA</h1>
            <p id="um-off-d">Tentando de novo…</p>
            <!-- Link e não botão-com-JS: se o script não rodar, isto ainda funciona. -->
            <a class="acao" id="um-off-a" href="">Tentar agora</a>
        </span>
    </div>
    <script src="/js/offline.js"></script>
</body>
</html>
